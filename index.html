<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spck Editor Core Compressor (100KB-200KB)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f141c; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .wrapper { background: #1a2333; border: 1px solid #2d3d57; border-radius: 12px; padding: 25px; width: 100%; max-width: 500px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 5px; font-size: 20px; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .file-box { border: 2px dashed #38bdf8; padding: 30px; border-radius: 8px; background: #111827; position: relative; margin-bottom: 15px; }
        .file-box input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .btn { background: #0ea5e9; color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        #log { margin-top: 15px; font-size: 14px; color: #34d399; min-height: 20px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Spck Bulk Compressor Panel</h2>
    <div class="sub">टारगेट साइज: 100KB - 200KB (WebP)</div>
    
    <div class="file-box">
        <div id="txt">📁 इमेजेस चुनें (अधिकतम 50)</div>
        <input type="file" id="filesInput" accept="image/*" multiple>
    </div>

    <button id="goBtn" class="btn" disabled>कन्वर्ट और गैलरी में सेव करें</button>
    <div id="log">कोई फ़ाइल नहीं चुनी गई</div>
</div>

<script>
    const filesInput = document.getElementById('filesInput');
    const goBtn = document.getElementById('goBtn');
    const log = document.getElementById('log');
    const txt = document.getElementById('txt');
    let targetFiles = [];

    filesInput.addEventListener('change', (e) => {
        targetFiles = Array.from(e.target.files);
        if (targetFiles.length === 0) {
            txt.innerText = "📁 इमेजेस चुनें (अधिकतम 50)";
            goBtn.disabled = true;
            return;
        }
        if (targetFiles.length > 50) {
            alert("एक बार में केवल 50 इमेजेस ही चुन सकते हैं!");
            filesInput.value = '';
            targetFiles = [];
            goBtn.disabled = true;
            return;
        }
        txt.innerText = `🔥 ${targetFiles.length} इमेजेस लोड हो गईं`;
        goBtn.disabled = false;
        log.innerText = "बटन दबाकर प्रोसेस शुरू करें";
    });

    goBtn.addEventListener('click', async () => {
        goBtn.disabled = true;
        log.innerText = "प्रोसेसिंग चालू है...";

        for (let i = 0; i < targetFiles.length; i++) {
            log.innerText = `⏳ कनवर्ट हो रहा है: ${i + 1}/${targetFiles.length}`;
            try {
                await processAndForceDownload(targetFiles[i]);
            } catch (err) {
                console.error(err);
            }
        }

        log.innerText = "✅ सभी फाइलें आपकी गैलरी/डाउनलोड में सेव हो गईं!";
        filesInput.value = '';
        targetFiles = [];
        txt.innerText = "📁 इमेजेस चुनें (अधिकतम 50)";
    });

    function processAndForceDownload(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    
                    // मोबाइल क्रैश से बचने के लिए मैक्स साइज लिमिट
                    const maxDim = 1600;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    let quality = 0.85;
                    let steps = 0;
                    
                    function runTuning() {
                        steps++;
                        canvas.toBlob(function(blob) {
                            if (!blob) return reject();
                            const sizeKB = blob.size / 1024;
                            
                            // सख्त नियम: 100KB से 200KB के बीच लाना
                            if (sizeKB > 200 && quality > 0.1 && steps < 8) {
                                quality -= 0.08;
                                runTuning();
                            } else if (sizeKB < 100 && quality < 0.95 && steps < 8) {
                                quality += 0.05;
                                runTuning();
                            } else {
                                // Spck Editor के लिए खास कनवर्टर: Blob को DataURL में बदलकर डाउनलोड करना
                                const downloaderReader = new FileReader();
                                downloaderReader.readAsDataURL(blob);
                                downloaderReader.onloadend = function() {
                                    const base64Data = downloaderReader.result;
                                    const rawName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                                    
                                    const link = document.createElement('a');
                                    link.href = base64Data; // Blob URL की जगह Base64 का इस्तेमाल
                                    link.download = `${rawName}.webp`;
                                    
                                    document.body.appendChild(link);
                                    link.click();
                                    document.body.removeChild(link);
                                    
                                    // इमेजेस के बीच छोटा गैप ताकि ब्राउज़र ब्लॉक न करे
                                    setTimeout(resolve, 300);
                                };
                            }
                        }, 'image/webp', quality);
                    }
                    runTuning();
                };
            };
        });
    }
</script>

</body>
</html>
